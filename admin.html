<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encore Films 后台管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#141927;--border:#1e2736;--text:#e4e7f0;--muted:#8891a8;--primary:#4f7cff;--success:#34d399;--danger:#ef4444}
body{font-family:'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.login-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:32px;color:var(--primary)}
.login-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:16px;outline:none;transition:border .2s}
.login-input:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.main-container{display:none;max-width:1400px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.logo-title{font-size:28px;font-weight:700;color:var(--primary)}
.logout-btn{padding:10px 20px;background:var(--danger);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:12px;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:12px 24px;background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;position:relative;transition:color .2s}
.tab.active{color:var(--primary);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:600;margin-bottom:16px;color:var(--primary)}
.btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn-danger{background:var(--danger)}
.drama-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.drama-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:border-color .2s}
.drama-card:hover{border-color:var(--primary)}
.drama-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;margin-bottom:12px;background:var(--border)}
.drama-title{font-size:16px;font-weight:600;margin-bottom:4px}
.drama-shares{font-size:13px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:20px;z-index:1000;overflow-y:auto}
.modal.on{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:600;margin-bottom:24px;color:var(--primary)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:var(--text)}
.form-input,.form-textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
.form-textarea{resize:vertical;min-height:80px;font-family:inherit}
.img-preview{max-width:100%;height:auto;border-radius:6px;margin-top:8px;display:none}
.modal-actions{display:flex;gap:12px;margin-top:24px}
.toast{position:fixed;top:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:2000;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.err{border-color:var(--danger);background:rgba(239,68,68,.1)}
.toast.ok{border-color:var(--success);background:rgba(52,211,153,.1)}
.price-current{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.pc-value{font-size:32px;font-weight:700;color:var(--primary)}
.pcchg{font-size:14px}
.pcchg.up{color:var(--success)}
.pcchg.down{color:var(--danger)}
.ph-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border-radius:6px;margin-bottom:8px}
.ph-date{min-width:100px;font-size:13px;color:var(--muted)}
.ph-price{flex:1;font-weight:600}
.ph-chg{min-width:80px;font-size:13px;text-align:right}
.ph-chg.up{color:var(--success)}
.ph-chg.down{color:var(--danger)}
.ph-del{background:var(--danger);color:#fff;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:12px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,40px);gap:8px;margin-bottom:12px}
.theme-swatch{width:40px;height:40px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.theme-swatch.active{border-color:#fff}
#sqlBlock{background:var(--bg);color:#34d399;padding:16px;border-radius:6px;font-family:monospace;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin-bottom:16px;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">Encore Films 后台</div>
    <input class="login-input" id="pwInput" type="text" placeholder="请输入密码" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">登录</button>
  </div>
</div>

<div class="main-container" id="mainContainer">
  <div class="header">
    <div class="logo-title">📊 Encore Films 后台</div>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab(0)">作品管理</button>
    <button class="tab" onclick="switchTab(1)">价格管理</button>
    <button class="tab" onclick="switchTab(2)">网站设置</button>
    <button class="tab" onclick="switchTab(3)">初始化</button>
  </div>

  <div class="tab-content active" id="tab0">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="card-title">短剧列表</div>
        <button class="btn" onclick="openEditModal()">+ 添加新作品</button>
      </div>
      <div class="drama-grid" id="dramaGrid"></div>
    </div>
  </div>

  <div class="tab-content" id="tab1">
    <div class="card">
      <div class="card-title">今日价格录入</div>
      <div class="form-group">
        <label class="form-label">选择作品</label>
        <select class="form-input" id="priceSelect" onchange="loadPriceHistory()">
          <option value="">— 请选择 —</option>
        </select>
      </div>
      <div id="priceCurrentBox" style="display:none">
        <div class="price-current">
          <span class="pc-value" id="pcValue">—</span>
          <span class="pcchg" id="pcChg"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">录入价格 <span id="todayDateLabel" style="color:var(--muted);font-size:12px"></span></label>
        <input class="form-input" id="priceInput" type="number" step="0.01" placeholder="例：125.50">
      </div>
      <button class="btn" onclick="savePrice()">保存今日价格</button>
    </div>
    <div class="card" id="priceHistoryCard" style="display:none">
      <div class="card-title">历史价格（最近15条）</div>
      <div id="priceHistoryList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab2">
    <div class="card">
      <div class="card-title">基本信息</div>
      <div class="form-group">
        <label class="form-label">网站标题</label>
        <input class="form-input" id="siteTitle" placeholder="Encore Films">
      </div>
      <div class="form-group">
        <label class="form-label">副标题</label>
        <input class="form-input" id="siteSub" placeholder="숏드라마 투자 플랫폼">
      </div>
      <div class="form-group">
        <label class="form-label">货币符号</label>
        <input class="form-input" id="siteCurrency" placeholder="$">
      </div>
      <div class="form-group">
        <label class="form-label">LINE ID</label>
        <input class="form-input" id="lineId" placeholder="@encorefilms">
      </div>
    </div>
    <div class="card">
      <div class="card-title">LOGO 图片</div>
      <input type="file" accept="image/*" onchange="uploadImage(this,'logo')">
      <input class="form-input" id="logoUrl" placeholder="或粘贴图片链接" style="margin-top:8px" onblur="previewLogoUrl()">
      <img id="logoPreview" class="img-preview">
    </div>
    <div class="card">
      <div class="card-title">LINE 二维码</div>
      <input type="file" accept="image/*" onchange="uploadImage(this,'qr')">
      <input class="form-input" id="qrUrl" placeholder="或粘贴图片链接" style="margin-top:8px" onblur="previewQrUrl()">
      <img id="qrPreview" class="img-preview">
    </div>
    <div class="card">
      <div class="card-title">主题色</div>
      <div class="theme-grid" id="themeGrid"></div>
      <div id="themeName" style="font-size:14px;color:var(--muted)"></div>
    </div>
    <button class="btn" onclick="saveSettings()">保存设置</button>
  </div>

  <div class="tab-content" id="tab3">
    <div class="card">
      <div class="card-title">数据库初始化 SQL</div>
      <pre id="sqlBlock"></pre>
      <button class="btn" onclick="copySql()">复制 SQL</button>
    </div>
    <div class="card">
      <div class="card-title">检测连接</div>
      <button class="btn" onclick="testConnection()">检测数据库连接</button>
      <p id="connResult" style="margin-top:12px;font-size:14px"></p>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-title" id="editModalTitle">编辑作品</div>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label class="form-label">剧名</label>
      <input class="form-input" id="editTitle">
    </div>
    <div class="form-group">
      <label class="form-label">简介</label>
      <textarea class="form-textarea" id="editDesc"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">总股数</label>
      <input class="form-input" id="editTotal" type="number">
    </div>
    <div class="form-group">
      <label class="form-label">已售股数</label>
      <input class="form-input" id="editSold" type="number">
    </div>
    <div class="form-group">
      <label class="form-label">排序序号</label>
      <input class="form-input" id="editSort" type="number">
    </div>
    <div class="form-group">
      <label class="form-label">初始价格（可选，仅新增时）</label>
      <input class="form-input" id="editPrice" type="number" step="0.01">
    </div>
    <div class="form-group">
      <label class="form-label">海报图片</label>
      <input type="file" accept="image/*" onchange="uploadImage(this,'poster')">
      <input class="form-input" id="posterUrl" placeholder="或粘贴图片链接" style="margin-top:8px" onblur="previewPosterUrl()">
      <img id="posterPreview" class="img-preview">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="saveDrama()">保存</button>
      <button class="btn" style="background:var(--muted)" onclick="closeEditModal()">取消</button>
      <button class="btn btn-danger" id="deleteDramaBtn" onclick="deleteDrama()" style="margin-left:auto">删除</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://unsxprbxztpgholjojkh.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuc3hwcmJ4enRwZ2hvbGpvamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDk3OTQsImV4cCI6MjExMDM4NTc5NH0.oGtTGf2uFuq41fV-Wn6aHNdDnCBGBomJIZ1yAbmyWtY';
const PASSWORD_PINYIN = 'niudehua';
const PASSWORD_CHINESE = '牛得滑';

const supabase = window.supabase.createClient(SB_URL, SB_ANON);

let DRAMAS = [];
let SETTINGS = {};
let pendingPosterUrl = '';
let pendingLogoUrl = '';
let pendingQrUrl = '';
let currentTheme = 0;

const THEMES = [
  {n:'深空蓝',p:'#4f7cff'}, {n:'翡翠绿',p:'#34d399'}, {n:'珊瑚红',p:'#f87171'},
  {n:'琥珀橙',p:'#fb923c'}, {n:'薰衣草',p:'#a78bfa'}, {n:'玫瑰金',p:'#fbbf24'},
  {n:'青瓷',p:'#2dd4bf'}, {n:'胭脂',p:'#ec4899'}, {n:'靛蓝',p:'#6366f1'},
  {n:'柠檬黄',p:'#facc15'}, {n:'孔雀绿',p:'#14b8a6'}, {n:'桃粉',p:'#fb7185'},
  {n:'灰蓝',p:'#64748b'}, {n:'烟紫',p:'#c084fc'}, {n:'橄榄',p:'#84cc16'},
  {n:'墨绿',p:'#059669'}
];

function $(id){ return document.getElementById(id); }
function toast(msg, type='ok'){
  const t = document.createElement('div');
  t.className = 'toast '+(type==='err'?'err':'ok');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function todayKST(){ return new Date(Date.now()+32400000).toISOString().slice(0,10); }

// ===== LOGIN =====
function doLogin(){
  const val = $('pwInput').value.trim();
  if(val === PASSWORD_CHINESE || val === PASSWORD_PINYIN){
    $('loginScreen').style.display = 'none';
    $('mainContainer').style.display = 'block';
    init();
  } else {
    toast('密码错误','err');
  }
}
function doLogout(){
  $('loginScreen').style.display = 'flex';
  $('mainContainer').style.display = 'none';
  $('pwInput').value = '';
}

// ===== INIT =====
async function init(){
  await loadSettings();
  await loadDramas();
  loadPriceSelects();
  buildThemeGrid();
  buildSetupSQL();
}

// ===== TABS =====
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,idx) => t.classList.toggle('active', idx===i));
  document.querySelectorAll('.tab-content').forEach((c,idx) => c.classList.toggle('active', idx===i));
}

// ===== DRAMAS =====
async function loadDramas(){
  try{
    const { data, error } = await supabase.from('dramas').select('*').order('sort_order');
    if(error) throw error;
    DRAMAS = data || [];
    const g = $('dramaGrid');
    if(!DRAMAS.length){ g.innerHTML='<p style="color:var(--muted)">暂无作品，点击右上角添加</p>'; return; }
    g.innerHTML = DRAMAS.map(d => {
      const lastPrice = d.last_price ? `$${Number(d.last_price).toLocaleString('en-US',{maximumFractionDigits:2})}` : '—';
      return `<div class="drama-card" onclick="openEditModal(${d.id})">
        <img class="drama-poster" src="${d.poster_url||''}">
        <div class="drama-title">${esc(d.title||'未命名')}</div>
        <div class="drama-shares">总 ${d.total_shares||0} / 已售 ${d.sold_shares||0}</div>
        <div class="drama-shares">价格: ${lastPrice}</div>
      </div>`;
    }).join('');
    loadPriceSelects();
  } catch(e){ toast('加载失败：'+e.message,'err'); }
}

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== EDIT MODAL =====
function openEditModal(id){
  pendingPosterUrl = '';
  const d = id ? DRAMAS.find(x => x.id===id) : null;
  $('editModalTitle').textContent = d ? '编辑作品' : '添加新作品';
  $('editId').value = d ? d.id : '';
  $('editTitle').value = d ? (d.title||'') : '';
  $('editDesc').value = d ? (d.description||'') : '';
  $('editTotal').value = d ? (d.total_shares||'') : '';
  $('editSold').value = d ? (d.sold_shares||'') : '';
  $('editSort').value = d ? (d.sort_order||0) : DRAMAS.length;
  $('editPrice').value = '';
  $('posterUrl').value = d ? (d.poster_url||'') : '';
  const prev = $('posterPreview');
  if(d && d.poster_url){ prev.src=d.poster_url; prev.style.display='block'; }
  else { prev.src=''; prev.style.display='none'; }
  $('deleteDramaBtn').style.display = d ? 'flex' : 'none';
  $('editModal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeEditModal(){
  $('editModal').classList.remove('on');
  document.body.style.overflow = '';
}

async function saveDrama(){
  const id = $('editId').value;
  const title = $('editTitle').value.trim();
  const desc = $('editDesc').value.trim();
  const total = parseInt($('editTotal').value)||0;
  const sold = parseInt($('editSold').value)||0;
  const sort = parseInt($('editSort').value)||0;
  const initPrice = parseFloat($('editPrice').value)||null;
  const posterUrl = $('posterUrl').value.trim() || pendingPosterUrl || (id ? DRAMAS.find(d=>d.id==id)?.poster_url||null : null);

  if(!title){ toast('请填写剧名','err'); return; }

  const payload = { title, description:desc, poster_url:posterUrl, total_shares:total, sold_shares:sold, sort_order:sort };

  try{
    let dramaId = id ? parseInt(id) : null;
    if(id){
      const { error } = await supabase.from('dramas').update(payload).eq('id', id);
      if(error) throw error;
      toast('作品已更新 ✓');
    } else {
      const { data, error } = await supabase.from('dramas').insert([payload]).select();
      if(error) throw error;
      dramaId = data[0]?.id;
      toast('作品已添加 ✓');
    }
    if(initPrice && dramaId){
      const { error } = await supabase.from('price_history').upsert({drama_id:dramaId, price_date:todayKST(), price:initPrice});
      if(error) throw error;
    }
    closeEditModal();
    await loadDramas();
  } catch(e){ toast('保存失败：'+e.message,'err'); }
}

async function deleteDrama(){
  const id = $('editId').value;
  if(!id) return;
  if(!confirm('确定删除这部作品？价格历史也将一起删除，无法恢复。')) return;
  try{
    await supabase.from('price_history').delete().eq('drama_id', id);
    await supabase.from('dramas').delete().eq('id', id);
    toast('已删除');
    closeEditModal();
    await loadDramas();
  } catch(e){ toast('删除失败：'+e.message,'err'); }
}

// ===== IMAGE UPLOAD =====
async function uploadImage(input, type){
  const file = input.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop();
  const path = type+'/'+Date.now()+'.'+ext;
  toast('上传中…','ok');
  try{
    const { data, error } = await supabase.storage.from('media').upload(path, file);
    if(error) throw error;
    const { data: { publicUrl } } = supabase.storage.from('media').getPublicUrl(path);
    const url = publicUrl;
    if(type === 'poster'){
      pendingPosterUrl = url;
      $('posterPreview').src = url; $('posterPreview').style.display = 'block';
      $('posterUrl').value = url;
    } else if(type === 'logo'){
      pendingLogoUrl = url;
      $('logoPreview').src = url; $('logoPreview').style.display = 'block';
      $('logoUrl').value = url;
    } else if(type === 'qr'){
      pendingQrUrl = url;
      $('qrPreview').src = url; $('qrPreview').style.display = 'block';
      $('qrUrl').value = url;
    }
    toast('上传成功 ✓');
  } catch(e){
    toast('上传失败，请粘贴图片链接代替','err');
    console.error(e);
  }
}

function previewPosterUrl(){
  const url = $('posterUrl').value.trim();
  const prev = $('posterPreview');
  if(url){ prev.src=url; prev.style.display='block'; }
  else { prev.src=''; prev.style.display='none'; }
  pendingPosterUrl = url;
}
function previewLogoUrl(){
  const url = $('logoUrl').value.trim();
  const prev = $('logoPreview');
  if(url){ prev.src=url; prev.style.display='block'; }
  else { prev.src=''; prev.style.display='none'; }
}
function previewQrUrl(){
  const url = $('qrUrl').value.trim();
  const prev = $('qrPreview');
  if(url){ prev.src=url; prev.style.display='block'; }
  else { prev.src=''; prev.style.display='none'; }
}

// ===== PRICE =====
function loadPriceSelects(){
  const sel = $('priceSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— 请选择 —</option>' +
    DRAMAS.map(d => `<option value="${d.id}">${esc(d.title||'（未命名）')}</option>`).join('');
  if(cur) { sel.value = cur; loadPriceHistory(); }
  $('todayDateLabel').textContent = todayKST()+' (KST)';
}

async function loadPriceHistory(){
  const id = $('priceSelect').value;
  if(!id){ $('priceCurrentBox').style.display='none'; $('priceHistoryCard').style.display='none'; return; }
  try{
    const { data, error } = await supabase.from('price_history').select('*').eq('drama_id', id).order('price_date', {ascending:false}).limit(15);
    if(error) throw error;
    const rows = data || [];
    $('priceCurrentBox').style.display = 'block';
    if(rows.length){
      $('pcValue').textContent = '$'+Number(rows[0].price).toLocaleString('en-US',{maximumFractionDigits:2});
      if(rows.length >= 2){
        const chg = (rows[0].price - rows[1].price)/rows[1].price*100;
        const cls = chg >= 0 ? 'up' : 'down';
        $('pcChg').className = 'pcchg '+cls;
        $('pcChg').textContent = (chg>=0?'▲ ':'▼ ')+Math.abs(chg).toFixed(2)+'% 较前日';
      } else { $('pcChg').textContent = ''; }
      $('priceInput').placeholder = Number(rows[0].price).toFixed(2);
    } else {
      $('pcValue').textContent = '—';
      $('pcChg').textContent = '暂无数据';
    }
    if(rows.length){
      $('priceHistoryCard').style.display = 'block';
      $('priceHistoryList').innerHTML = rows.map((r,i) => {
        const chg = i < rows.length-1 ? (r.price-rows[i+1].price)/rows[i+1].price*100 : null;
        const cls = chg===null?'flat':chg>0?'up':'down';
        const chgTxt = chg===null?'—':(chg>=0?'▲ ':'▼ ')+Math.abs(chg).toFixed(2)+'%';
        return `<div class="ph-row">
          <span class="ph-date">${r.price_date}</span>
          <span class="ph-price">$${Number(r.price).toLocaleString('en-US',{maximumFractionDigits:2})}</span>
          <span class="ph-chg ${cls}">${chgTxt}</span>
          <button class="ph-del" onclick="deletePrice(${r.id})">×</button>
        </div>`;
      }).join('');
    } else { $('priceHistoryCard').style.display='none'; }
  } catch(e){ toast('加载失败：'+e.message,'err'); }
}

async function savePrice(){
  const id = $('priceSelect').value;
  const price = parseFloat($('priceInput').value);
  if(!id){ toast('请选择作品','err'); return; }
  if(!price || price <= 0){ toast('请输入有效价格','err'); return; }
  try{
    const { error } = await supabase.from('price_history').upsert({drama_id:parseInt(id), price_date:todayKST(), price});
    if(error) throw error;
    $('priceInput').value = '';
    toast('价格已保存 ✓');
    await loadPriceHistory();
    await loadDramas();
  } catch(e){ toast('保存失败：'+e.message,'err'); }
}

async function deletePrice(rowId){
  if(!confirm('删除这条价格记录？')) return;
  try{
    await supabase.from('price_history').delete().eq('id', rowId);
    toast('已删除');
    await loadPriceHistory();
    await loadDramas();
  } catch(e){ toast('删除失败：'+e.message,'err'); }
}

// ===== SETTINGS =====
async function loadSettings(){
  try{
    const { data, error } = await supabase.from('settings').select('*').eq('id', 1);
    if(error) throw error;
    SETTINGS = data[0] || {};
    $('siteTitle').value = SETTINGS.site_title || 'Encore Films';
    $('siteSub').value = SETTINGS.site_subtitle || '숏드라마 투자 플랫폼';
    $('siteCurrency').value = SETTINGS.currency || '$';
    $('lineId').value = SETTINGS.line_id || '';
    $('logoUrl').value = SETTINGS.logo_url || '';
    $('qrUrl').value = SETTINGS.line_qr_url || '';
    if(SETTINGS.logo_url){ $('logoPreview').src=SETTINGS.logo_url; $('logoPreview').style.display='block'; }
    if(SETTINGS.line_qr_url){ $('qrPreview').src=SETTINGS.line_qr_url; $('qrPreview').style.display='block'; }
    currentTheme = Number(SETTINGS.theme)||0;
    updateThemeGrid();
  } catch(e){ console.error('Settings load:', e); }
}

async function saveSettings(){
  const payload = {
    id: 1,
    site_title: $('siteTitle').value.trim() || 'Encore Films',
    site_subtitle: $('siteSub').value.trim(),
    currency: $('siteCurrency').value.trim() || '$',
    line_id: $('lineId').value.trim(),
    logo_url: $('logoUrl').value.trim() || null,
    line_qr_url: $('qrUrl').value.trim() || null,
    theme: currentTheme
  };
  try{
    const { error } = await supabase.from('settings').upsert([payload]);
    if(error) throw error;
    SETTINGS = payload;
    toast('设置已保存 ✓');
  } catch(e){ toast('保存失败：'+e.message,'err'); }
}

// ===== THEME =====
function buildThemeGrid(){
  const grid = $('themeGrid');
  grid.innerHTML = THEMES.map((t,i) =>
    `<div class="theme-swatch${i===currentTheme?' active':''}" style="background:${t.p}" title="${t.n}" onclick="selectTheme(${i})"></div>`
  ).join('');
  $('themeName').textContent = THEMES[currentTheme]?.n || '';
}
function updateThemeGrid(){
  document.querySelectorAll('.theme-swatch').forEach((el,i) => el.classList.toggle('active', i===currentTheme));
  $('themeName').textContent = THEMES[currentTheme]?.n || '';
}
function selectTheme(i){
  currentTheme = i;
  updateThemeGrid();
}

// ===== SETUP SQL =====
function buildSetupSQL(){
  const sql = `-- 完整初始化 SQL

-- 1. 短剧表
create table if not exists dramas (
  id serial primary key,
  title text,
  description text,
  poster_url text,
  total_shares integer default 1000,
  sold_shares integer default 0,
  sort_order integer default 0,
  created_at timestamptz default now()
);

-- 2. 价格历史表
create table if not exists price_history (
  id serial primary key,
  drama_id integer references dramas(id) on delete cascade,
  price_date date not null,
  price numeric(12,4) not null,
  created_at timestamptz default now(),
  unique(drama_id, price_date)
);

-- 3. 设置表
create table if not exists settings (
  id integer primary key default 1,
  site_title text default 'Encore Films',
  site_subtitle text default '숏드라마 투자 플랫폼',
  currency text default '$',
  logo_url text,
  line_qr_url text,
  line_id text default '@encorefilms',
  theme integer default 0
);

-- 4. 插入默认设置
insert into settings (id) values (1)
on conflict (id) do nothing;

-- 5. 删除旧 policy（如果存在）
drop policy if exists "public_read_dramas" on dramas;
drop policy if exists "public_read_price_history" on price_history;
drop policy if exists "public_read_settings" on settings;

-- 6. 开放行级安全（前台读取）
alter table dramas enable row level security;
alter table price_history enable row level security;
alter table settings enable row level security;

create policy "public_read_dramas"
  on dramas for select using (true);
  
create policy "public_read_price_history"
  on price_history for select using (true);
  
create policy "public_read_settings"
  on settings for select using (true);

-- 7. 删除旧 Storage policy（如果存在）
drop policy if exists "public_read_media" on storage.objects;
drop policy if exists "public_upload_media" on storage.objects;
drop policy if exists "public_delete_media" on storage.objects;

-- 8. Storage 桶权限（media 桶必须已建好）
create policy "public_read_media"
  on storage.objects for select
  using ( bucket_id = 'media' );

create policy "public_upload_media"
  on storage.objects for insert
  with check ( bucket_id = 'media' );

create policy "public_delete_media"
  on storage.objects for delete
  using ( bucket_id = 'media' );`;
  $('sqlBlock').textContent = sql;
}
function copySql(){
  const sql = $('sqlBlock').textContent;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(sql).then(()=>toast('SQL 已复制 ✓')).catch(()=>toast('复制失败','err'));
  } else {
    const a = document.createElement('textarea');
    a.value = sql; a.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast('SQL 已复制 ✓'); } catch(e){ toast('复制失败','err'); }
    a.remove();
  }
}

async function testConnection(){
  const r = $('connResult');
  r.textContent = '检测中…'; r.style.color = 'var(--muted)';
  try{
    const { data, error } = await supabase.from('dramas').select('id').limit(1);
    if(error) throw error;
    r.textContent = '✅ 连接成功！数据库正常。';
    r.style.color = 'var(--success)';
  } catch(e){
    r.textContent = '❌ 连接失败：'+e.message.slice(0,120);
    r.style.color = 'var(--danger)';
  }
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeEditModal(); });
